<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>password please</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#dcedc8;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  background:#fff;
  border-radius:12px;
  padding:40px 36px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
  width:320px;
  text-align:center;
}

.box h2{
  font-size:20px;
  margin-bottom:28px;
  color:#333;
}

.box input{
  width:100%;
  font-size:18px;
  padding:10px 14px;
  border:1px solid #ccc;
  border-radius:6px;
  outline:none;
  transition:border-color 0.2s;
  text-align:center;
  letter-spacing:2px;
}

.box input:focus{
  border-color:#6aa9ff;
  box-shadow:0 0 6px rgba(106,169,255,0.25);
}

.box button{
  margin-top:18px;
  width:100%;
  padding:10px;
  font-size:17px;
  background:#333;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:background 0.15s;
}

.box button:hover{
  background:#111;
}

.error{
  margin-top:14px;
  color:#e05050;
  font-size:15px;
  min-height:20px;
}
</style>
</head>
<body>

<div class="box">
  <h2>📚 Charlie Adam</h2>
  <input
    type="password"
    id="pwd"
    placeholder="萬里長城今猶在"
    onkeydown="if(event.key==='Enter') verify()"
    autofocus
  >
  <button onclick="verify()">进入</button>
  <div class="error" id="err"></div>
</div>

<script>
var CORRECT = "szoboszlai";

function verify(){
  var val = document.getElementById("pwd").value;
  if(val === CORRECT){
    sessionStorage.setItem("auth","1");
    window.location.href = "projects.html";
  }else{
    document.getElementById("err").innerText = "password错误，请重试";
    document.getElementById("pwd").value = "";
    document.getElementById("pwd").focus();
  }
}
</script>

</body>
</html>
